# Render.com Blueprint for VoxFlow Backend API (100% Free Tier Compatible)
# 
# 1-Click Zero-Downtime Deployment on Render Free Tier.
#
# To deploy: Connect your repository to Render -> Blueprints -> New Blueprint Instance.

services:
  - type: web
    name: voxflow-api
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # Set to your Supabase Session Pooler URI (port 5432)
      - key: GROQ_API_KEY
        sync: false # Groq API Key for LLM + Whisper STT
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://voxflow-api.onrender.com
      - key: API_CORS_ORIGINS
        sync: false # e.g. https://voxflow-voice-agent.vercel.app,http://localhost:3000
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false # Paste your LangSmith lsv2_pt_... API key
      - key: LANGSMITH_PROJECT
        value: "voxflow-production"
      - key: DATA_DIR
        value: "/tmp/voxflow-data"
      - key: SHEETS_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LLM_PROVIDER
        value: "groq"
      - key: STT_PROVIDER
        value: "groq"
      - key: TTS_DEFAULT_LANG
        value: "hi"
      # Day 28: worker code is deployed but campaign dispatch remains staged
      # until Day 29 canary verification and explicit operator activation.
      - key: DURABLE_CAMPAIGN_WORKER_ENABLED
        value: "false"
      # Day 34: typed operational side-effect jobs are deployed but their worker
      # remains independently disabled and dry-run protected. No integration
      # request can originate from the Render API service.
      - key: DURABLE_SIDE_EFFECTS_WORKER_ENABLED
        value: "false"
      - key: DURABLE_SIDE_EFFECTS_DRY_RUN
        value: "true"
      # Day 33: Dial callback code is deployed for fixture certification only.
      # No webhook subscription or signing secret is configured in production.
      - key: DIAL_CALLBACK_ADAPTER_ENABLED
        value: "false"
      - key: DIAL_CALLBACK_SANDBOX_MODE
        value: "true"
