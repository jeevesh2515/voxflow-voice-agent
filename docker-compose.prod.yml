# VoxFlow Production Stack — Full containerized deployment
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Services:
#   caddy — Automatic Let's Encrypt TLS termination & reverse proxy
#           Routes /dashboard* and /_next* to web:3000, all else to api:8000
#   api   — FastAPI backend (telephony, agent, database, Sheets queue, session recovery)
#   web   — Next.js production dashboard (multi-stage standalone build)
#
# Storage:
#   voxflow_data — Persistent volume for crash snapshots, logs, backups, and Sheets retry queue
#   caddy_data   — Persistent certificates across restarts
#   caddy_config — Caddy configuration cache

services:
  caddy:
    image: caddy:2-alpine
    container_name: voxflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # Required for ACME HTTP challenge
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
    depends_on:
      - api
      - web

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: voxflow-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
    expose:
      - "8000"
    volumes:
      - voxflow_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 640m
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CRISP_WEBSITE_ID=${NEXT_PUBLIC_CRISP_WEBSITE_ID}
        - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
    container_name: voxflow-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN}
      - NEXT_PUBLIC_WS_URL=wss://${DOMAIN}
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}
      - NEXT_PUBLIC_CRISP_WEBSITE_ID=${NEXT_PUBLIC_CRISP_WEBSITE_ID}
    depends_on:
      - api
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  voxflow_data:
  caddy_data:
  caddy_config:
