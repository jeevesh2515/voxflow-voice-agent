# fly.toml app configuration file generated for voxflow-voice-agent on 2026-08-20T17:57:44Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'voxflow-voice-agent'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  # Approved persistent API availability: do not stop the only live backend.
  # This does not start any campaign, provider, callback, or side-effect worker.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
