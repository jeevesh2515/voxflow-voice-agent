# VoxFlow production stack — Full containerized deployment with Caddy reverse proxy
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Services:
#   caddy — terminates TLS with an automatic Let's Encrypt certificate and
#           reverse-proxies API prefixes (/api, /twilio, /ws/call) to the
#           backend and everything else (marketing, auth, /dashboard, /_next)
#           to the Next.js web app. See Caddyfile for the exact routing.
#   api   — the FastAPI backend (telephony, agent, database, Sheets queue, session recovery)
#   web   — the Next.js production dashboard

services:
  caddy:
    image: caddy:2-alpine
    container_name: voxflow-caddy
    restart: unless-stopped
    ports:
      - "80:80"     # required for ACME HTTP challenge
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # persists certificates across restarts
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-voxflow-jeevesh.duckdns.org}
      - ACME_EMAIL=${ACME_EMAIL:-admin@voxflow-jeevesh.duckdns.org}
    depends_on:
      - api
      - web

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: voxflow-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DATA_DIR=/app/data
    expose:
      - "8000"
    volumes:
      - voxflow_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 640m
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: voxflow-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-voxflow-jeevesh.duckdns.org}
      - NEXT_PUBLIC_WS_URL=wss://${DOMAIN:-voxflow-jeevesh.duckdns.org}
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      - api
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  voxflow_data:
  caddy_data:
  caddy_config:
